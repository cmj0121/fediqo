name: Release

# A tag, and nothing else. Pushing `v0.1.0` is what says a release happened; everything after
# that this run works out for itself, out of the checkout it was handed.
#
# workflow_dispatch is here so that a release which failed at the upload can be run again
# against the same tag -- GitHub's own dropdown lists tags as well as branches -- rather than
# a `v0.1.1` being invented because the pipeline could not be asked twice.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time, and never cancelled halfway. A run that has reached the upload has
# already spent a build number, and killing it leaves App Store Connect holding half a story.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Both apps, to TestFlight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/version.sh reads the tags and counts the commits behind HEAD. A shallow
          # clone has neither, and would answer 0.0.0 without failing -- which is the kind of
          # wrong that reaches the store.
          fetch-depth: 0

      # #10 asks that nothing be needed beyond this checkout and one brew install.
      - name: Install XcodeGen
        run: brew install xcodegen

      # The Gemfile is pinned so that a release does not change because somebody upgraded a
      # laptop; pinning the Ruby as well is the other half of that sentence.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Cache the Xcode build
        uses: actions/cache@v4
        with:
          path: .build/xcode-release/SourcePackages
          key: xcode-release-spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: xcode-release-spm-${{ runner.os }}-

      # The whole of the release, and the same line a laptop types. Every decision this run
      # makes is made in the Fastfile, which a laptop runs too: what to call the build, which
      # certificate to sign with, what the store is told, and that nothing is submitted for
      # review. This file only knows which tag it is and where the secrets are kept.
      - name: make publish
        run: make publish
        env:
          # fastlane refuses to run under a locale that is not UTF-8, and half the text this
          # release uploads is Chinese.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          FASTLANE_SKIP_UPDATE_CHECK: "1"

          FEDIQO_TEAM_ID: ${{ secrets.FEDIQO_TEAM_ID }}
          FEDIQO_BUNDLE_ID: ${{ secrets.FEDIQO_BUNDLE_ID }}

          # Over HTTPS here, because a runner has no ssh key to clone with -- the same
          # repository the laptop reaches over ssh, named the other way.
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # A laptop has a keychain holding this already. A runner has no keychain until
          # `setup_ci` makes it one, and nothing to remember the passphrase with.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

          # The way in that needs nobody watching, which is the only kind a runner can use.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}

      # What xcodebuild actually said. gym prints a summary and keeps the rest here, so
      # without this a release that broke on a runner and nowhere else is a failure nobody
      # can read -- which is an afternoon this project has already spent once.
      - name: Collect what the build said
        if: failure()
        run: cp -R "$HOME/Library/Logs/gym" .build/gym-logs || true

      - name: What the build said
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: .build/gym-logs
          retention-days: 7
