name: Servers

# The rest of the check: real protocol servers, the suite against them, and a
# release build. Pull requests keep the three jobs in ci.yml — that is what
# green means on them.
#
# Started by hand, and by nothing else. It ran on every push to main and never
# once passed: a hosted macOS runner is Apple silicon and will not start a VM
# inside itself, so there is no Docker for the servers to stand in, and the job
# fails closed before it brings one up (scripts/ci-docker.sh). A run that cannot
# pass says nothing about the push it is drawn beside, and a mark that is always
# red hides the day one turns red for a reason. Until a runner that can hold the
# servers runs this, what talks to them is checked on a desk:
# `make servers && FEDIQO_SERVERS=1 make test && make servers-down`.
#
# Put `push: branches: [main]` back when there is such a runner.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The same Xcode ci.yml names, and for its reason.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  servers:
    name: Servers, the slow suite, and a release build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      # GitHub's macOS images have no Docker Desktop. This script tries
      # colima and fails closed if a daemon never comes up, so a green job
      # is never one that skipped the servers.
      - name: Docker, or this job is not honest
        run: scripts/ci-docker.sh

      - name: Bring the servers up
        run: make servers

      - name: The suite, including what talks to those servers
        run: FEDIQO_SERVERS=1 swift test --only-use-versions-from-resolved-file

      - name: The same code, built the way a release is
        run: swift build -c release

      - name: Throw the servers away
        if: always()
        run: make servers-down
