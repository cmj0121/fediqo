name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and coverage
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version

      - name: Cache the package build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The gate is 85% of the lines in Sources/FediqoCore. FediqoUI is excluded on
      # purpose and the script says why -- it is view bodies this package cannot execute,
      # so counting them would measure how much of the app is a view, not how well it is
      # tested. A UI test target gets its own gate rather than being folded into this one.
      - name: Tests, and the coverage they leave behind
        run: ./scripts/coverage.sh 85

      - name: The same code, built the way a release is
        run: swift build -c release

  build:
    name: Both apps, from a clean checkout
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # #10 asks that nothing be needed beyond this checkout and one brew install.
      # If this line ever grows a second install, that promise has been broken.
      - name: Install XcodeGen
        run: brew install xcodegen

      # Xcode resolves the same packages into .build/xcode; the same key keeps them.
      - name: Cache the Xcode build
        uses: actions/cache@v4
        with:
          path: .build/xcode/SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-

      - name: macOS
        run: make -C Apps mac

      - name: iOS
        run: make -C Apps ios

      # What xcodebuild actually said. The console keeps the last five lines, which name the
      # files that failed and never the reason -- so without this a build that breaks on a
      # runner and nowhere else is a failure nobody can read.
      - name: What the build said
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .build/xcode/*-build.log
          retention-days: 7

  lint:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # The three jobs above are what green means on a pull request. This one is
  # the rest of the check: real protocol servers on the runner, the suite
  # against them, and a release build. It is `push` to `main` only — a feature
  # branch spends none of it. GitHub's macos-15 image has no Docker Desktop;
  # `scripts/ci-docker.sh` tries colima and **fails closed** if a daemon never
  # comes up, so a green job is never one that skipped the servers.
  servers:
    name: Servers, the slow suite, and a release build
    if: github.event_name == "push" && github.ref == "refs/heads/main"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version

      - name: Docker, or this job is not honest
        run: scripts/ci-docker.sh

      - name: Bring the servers up
        run: make servers

      - name: The suite, including what talks to those servers
        run: FEDIQO_SERVERS=1 swift test --only-use-versions-from-resolved-file

      - name: The same code, built the way a release is
        run: swift build -c release

      - name: Throw the servers away
        if: always()
        run: make servers-down
