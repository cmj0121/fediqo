name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and coverage
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version

      # GRDB is fetched from the network once per Package.resolved, not once per run.
      - name: Cache the package build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The gate is 85% of the lines in Sources/FediqoCore. FediqoUI is excluded on
      # purpose and the script says why -- it is view bodies this package cannot execute,
      # so counting them would measure how much of the app is a view, not how well it is
      # tested. A UI test target gets its own gate rather than being folded into this one.
      - name: Tests, and the coverage they leave behind
        run: ./scripts/coverage.sh 85

  build:
    name: Both apps, from a clean checkout
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # #10 asks that nothing be needed beyond this checkout and one brew install.
      # If this line ever grows a second install, that promise has been broken.
      - name: Install XcodeGen
        run: brew install xcodegen

      # Xcode resolves the same packages into .build/xcode; the same key keeps them.
      - name: Cache the Xcode build
        uses: actions/cache@v4
        with:
          path: .build/xcode/SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-

      - name: macOS
        run: make -C Apps mac

      - name: iOS
        run: make -C Apps ios

      # What xcodebuild actually said. The console keeps the last five lines, which name the
      # files that failed and never the reason -- so without this a build that breaks on a
      # runner and nowhere else is a failure nobody can read.
      - name: What the build said
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .build/xcode/*-build.log
          retention-days: 7

  # What `swift test` cannot ask. It reaches Core and the models above it and stops where
  # SwiftUI begins -- nothing in a package can execute a view body -- so this launches the real
  # app and drives it, against the world `Fixture` invents and no network at all.
  #
  # On the simulator, which is the whole reason it is here at all: a hosted macOS runner will
  # not grant an app the accessibility permission UI testing needs, so the same tests against
  # the macOS app fail at launch, every one of them, after waiting sixty seconds each. They
  # still run here by hand with `make -C Apps uitest`.
  #
  # It reports what it covered of Sources/FediqoUI and gates on nothing. The gate is
  # scripts/coverage.sh, which measures Core; what this number ought to be is a question to
  # answer from a few of these runs rather than from a threshold picked before the first one.
  uitest:
    name: The app, driven
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache the Xcode build
        uses: actions/cache@v4
        with:
          path: .build/xcode/SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-

      - name: Drive the app on a simulator
        run: make -C Apps uitest-ios

      # The log and not the result bundle: the bundle carries a screenshot of every step and
      # runs to a hundred megabytes, for an answer one line of text already has.
      - name: What the run said
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-log
          path: .build/xcode/uitest-ios.log
          retention-days: 7

  lint:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
