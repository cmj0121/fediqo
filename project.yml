# XcodeGen input. The .xcodeproj is generated from this and is not in the repository —
# `make xcodeproj` writes it, `make mac` runs that first.
name: Fediqo
options:
  bundleIdPrefix: tw.cmj
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Fediqo:
    path: .

targets:
  Fediqo:
    type: application
    platform: macOS
    sources:
      - path: Apps/Shared
    dependencies:
      - package: Fediqo
        product: FediqoUI
    info:
      path: Apps/macOS/Info.plist
    entitlements:
      path: Apps/macOS/Fediqo.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.cmj.fediqo
        PRODUCT_NAME: Fediqo
        INFOPLIST_FILE: Apps/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Fediqo.entitlements
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Fediqo-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/Shared
    dependencies:
      - package: Fediqo
        product: FediqoUI
    info:
      path: Apps/iOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.cmj.fediqo
        PRODUCT_NAME: Fediqo
        INFOPLIST_FILE: Apps/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
